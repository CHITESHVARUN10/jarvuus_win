name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version (without a leading v)
        required: true
        default: "0.1.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    env:
      # Optional signing secrets; the sign step is skipped when the certificate
      # is not configured.
      WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
      WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build release
        run: cargo build --release -p jarvis-app --locked

      # Same native-runtime preparation as ci.yml: the test binaries live in
      # target\debug\deps, while ort downloads DirectML.dll into its cache.
      - name: Prepare DirectML runtime
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path "$env:LOCALAPPDATA\ort.pyke.io" -Recurse -Filter DirectML.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dll) {
            Write-Error "DirectML.dll was not downloaded by the ort build"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path "target\debug" | Out-Null
          Copy-Item $dll.FullName "target\debug\DirectML.dll" -Force
          New-Item -ItemType Directory -Force -Path "target\debug\deps" | Out-Null
          Copy-Item $dll.FullName "target\debug\deps\DirectML.dll" -Force
          New-Item -ItemType Directory -Force -Path "target\debug\examples" | Out-Null
          Copy-Item $dll.FullName "target\debug\examples\DirectML.dll" -Force

      - name: Tests
        run: cargo test --workspace --all-targets

      - name: Package
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ github.event.inputs.version }}"
          } else {
            "${{ github.ref_name }}"
          }
          ./packaging/windows/build.ps1 -Version $version -SkipBuild

      # Unsigned builds still publish. When the signing secrets exist, sign.ps1
      # rewrites SHA256SUMS.txt so the published hashes cover the signed bytes.
      - name: Sign artifacts
        if: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE != '' }}
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          $cert = Join-Path $env:RUNNER_TEMP "jarvis-signing.pfx"
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE))
          try {
            ./packaging/windows/sign.ps1 -Version "${{ github.ref_name }}" -Certificate $cert -Password $env:WINDOWS_SIGNING_PASSWORD -SkipBuild
          } finally {
            Remove-Item $cert -Force -ErrorAction SilentlyContinue
          }

      - name: Verify installer signature
        if: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE != '' }}
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool.exe$' } |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          Get-ChildItem dist -Filter "*-setup.exe" | ForEach-Object {
            & $signtool verify /pa /all $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "$($_.Name) is not signed" }
          }

      - name: Warn on unsigned release
        if: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE == '' }}
        shell: pwsh
        run: |
          Write-Warning "Artifacts are unsigned: WINDOWS_SIGNING_CERTIFICATE is not configured."
          Write-Warning "Clients refuse unsigned updates, so this release is manual-install only."

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
