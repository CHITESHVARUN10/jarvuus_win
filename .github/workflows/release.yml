name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version (without a leading v)
        required: true
        default: "0.1.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build release
        run: cargo build --release -p jarvis-app --locked

      # Same native-runtime preparation as ci.yml: the test binaries live in
      # target\debug\deps, while ort downloads DirectML.dll into its cache.
      - name: Prepare DirectML runtime
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path "$env:LOCALAPPDATA\ort.pyke.io" -Recurse -Filter DirectML.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dll) {
            Write-Error "DirectML.dll was not downloaded by the ort build"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path "target\debug" | Out-Null
          Copy-Item $dll.FullName "target\debug\DirectML.dll" -Force
          New-Item -ItemType Directory -Force -Path "target\debug\deps" | Out-Null
          Copy-Item $dll.FullName "target\debug\deps\DirectML.dll" -Force
          New-Item -ItemType Directory -Force -Path "target\debug\examples" | Out-Null
          Copy-Item $dll.FullName "target\debug\examples\DirectML.dll" -Force

      - name: Tests
        run: cargo test --workspace --all-targets

      - name: Package
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ github.event.inputs.version }}"
          } else {
            "${{ github.ref_name }}"
          }
          ./packaging/windows/build.ps1 -Version $version -SkipBuild

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
