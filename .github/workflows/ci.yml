name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # Node is part of the developer toolchain (Command Code and repo scripts).
      # The Jarvis app itself is pure Rust and does not require Node at runtime.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Show Node version
        run: node --version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The build downloads ort's pinned DirectML ONNX Runtime distribution.
      # Linking it first catches missing Windows SDK pieces before tests.
      - name: Build
        run: cargo build --workspace

      # Windows test executables live in target\debug\deps. ort copies
      # DirectML.dll to the target directory, but symlink creation can fail
      # without Developer Mode, so place the DLL beside the test binaries.
      - name: Prepare DirectML runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path "$env:LOCALAPPDATA\ort.pyke.io" -Recurse -Filter DirectML.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dll) {
            Write-Error "DirectML.dll was not downloaded by the ort build"
            exit 1
          }
          Copy-Item $dll.FullName "target\debug\DirectML.dll" -Force
          New-Item -ItemType Directory -Force -Path "target\debug\deps" | Out-Null
          Copy-Item $dll.FullName "target\debug\deps\DirectML.dll" -Force
          New-Item -ItemType Directory -Force -Path "target\debug\examples" | Out-Null
          Copy-Item $dll.FullName "target\debug\examples\DirectML.dll" -Force

      - name: Tests
        run: cargo test --workspace --all-targets
