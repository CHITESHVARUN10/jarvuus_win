[package]
name = "jarvis-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Jarvis for Windows: native Rune shell and first-run setup"

[lib]
name = "jarvis_app"
path = "src/lib.rs"

[[bin]]
name = "jarvis"
path = "src/main.rs"

[features]
default = []
gpu-vulkan = ["jarvis-models/gpu-vulkan"]

[build-dependencies]
winresource = "0.1"

[dependencies]
jarvis-core = { path = "../jarvis-core" }
jarvis-platform = { path = "../jarvis-platform" }
jarvis-models = { path = "../jarvis-models" }
jarvis-speech = { path = "../jarvis-speech" }
jarvis-commands = { path = "../jarvis-commands" }
rune = { git = "https://github.com/anomalyco/rune", rev = "6ba947e580f2d864bb333d913ba843284e57f427" }
chrono.workspace = true
semver = "1"
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
