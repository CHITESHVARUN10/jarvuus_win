[package]
name = "jarvis-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Windows system adapters for Jarvis, with a preview stub for other platforms"

[dependencies]
jarvis-core = { path = "../jarvis-core" }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi"] }
